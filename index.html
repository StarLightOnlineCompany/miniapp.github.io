<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StarLight x Orbit — Поиск</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap');

        :root {
            --bg: #08080c; 
            --glass: rgba(255, 255, 255, 0.05); 
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #8b5cf6; 
            --primary-glow: rgba(139, 92, 246, 0.6);
            --secondary: #10b981; 
            --text: #ffffff;
            --text-muted: #9ca3af;
            --gray-logo: #666;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Manrope', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg); color: var(--text); padding-top: 10px; padding-bottom: 40px;
            overflow-x: hidden; background-image: radial-gradient(circle at top right, rgba(139, 92, 246, 0.15), transparent 40%), radial-gradient(circle at bottom left, rgba(16, 185, 129, 0.1), transparent 40%);
            background-attachment: fixed;
            display: flex; flex-direction: column; min-height: 100vh;
        }

        /* --- ШАПКА --- */
        .header { text-align: center; padding: 15px 0 25px 0; position: relative; }
        .logo-text {
            font-size: 28px; font-weight: 800; letter-spacing: -0.5px; 
            color: #fff; text-transform: uppercase; cursor: pointer;
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .logo-text .main { color: #fff; text-shadow: 0 0 10px rgba(139, 92, 246, 0.8), 0 0 20px rgba(139, 92, 246, 0.6); }
        .logo-text .main span { color: var(--primary); }
        
        /* Кнопка Orbit */
        .logo-text .x-orbit { 
            color: var(--gray-logo); font-size: 20px; font-weight: 600; 
            text-transform: none; letter-spacing: 0; cursor: pointer;
            transition: color 0.2s, text-shadow 0.2s;
        }
        .logo-text .x-orbit:hover, .logo-text .x-orbit:active { 
            color: #aaa; 
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        /* Всплывашка "Скоро" */
        .soon-popup {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%) translateY(0);
            background: rgba(30, 30, 40, 0.95);
            border: 1px solid var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
            color: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 14px;
            pointer-events: none;
            opacity: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* Анимация полета "Скоро" */
        .soon-popup.active {
            animation: flyUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes flyUp {
            0% { opacity: 0; transform: translateX(-50%) translateY(10px) scale(0.8); }
            20% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
            80% { opacity: 1; transform: translateX(-50%) translateY(-30px) scale(1); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-60px) scale(0.9); }
        }

        /* --- ЭКРАНЫ --- */
        .screen { display: none; padding: 0 20px; animation: fadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); flex: 1; }
        .screen.active { display: block; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* --- ГЛАВНАЯ --- */
        .portal-grid { display: flex; flex-direction: column; gap: 15px; max-width: 500px; margin: 0 auto; }
        .portal-btn {
            display: flex; align-items: center; gap: 20px; background: var(--glass); border: 1px solid var(--glass-border);
            padding: 25px 20px; border-radius: 24px; cursor: pointer; transition: all 0.2s; backdrop-filter: blur(10px); text-decoration: none; color: #fff;
        }
        .portal-btn:active { transform: scale(0.97); background: rgba(255,255,255,0.08); }
        .portal-icon { width: 50px; height: 50px; border-radius: 16px; background: rgba(139, 92, 246, 0.2); display: flex; align-items: center; justify-content: center; }
        .portal-icon svg { width: 28px; height: 28px; fill: var(--primary); }
        .portal-info h3 { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
        .portal-info p { font-size: 13px; color: var(--text-muted); font-weight: 500; }
        
        .portal-btn.disabled { opacity: 0.6; cursor: not-allowed; background: rgba(255, 255, 255, 0.02); }
        .portal-btn.disabled .portal-icon { background: rgba(255, 255, 255, 0.05); }
        .portal-btn.disabled .portal-icon svg { fill: var(--text-muted); }
        .badge-soon { background: var(--primary); color: #fff; font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 8px; text-transform: uppercase; margin-left: auto; box-shadow: 0 0 10px var(--primary-glow); }

        /* --- ПОИСКОВИК --- */
        .search-home { display: flex; flex-direction: column; align-items: center; margin-top: 20px; }
        .big-search-box {
            width: 100%; max-width: 600px; background: rgba(30, 30, 40, 0.8); border-radius: 20px;
            display: flex; align-items: center; padding: 15px 20px; border: 2px solid var(--glass-border); transition: border-color 0.3s, box-shadow 0.3s;
        }
        .big-search-box:focus-within { border-color: var(--primary); box-shadow: 0 0 20px var(--primary-glow); }
        .big-search-box input { background: transparent; border: none; outline: none; color: #fff; font-size: 18px; font-weight: 600; width: 100%; }
        .big-search-box svg { width: 24px; height: 24px; fill: var(--text-muted); margin-right: 15px; }

        /* --- РЕЗУЛЬТАТЫ --- */
        .search-page-top {
            position: sticky; top: 0; z-index: 50; background: rgba(8, 8, 12, 0.95); backdrop-filter: blur(20px);
            padding: 15px 20px; margin: 0 -20px 20px -20px; border-bottom: 1px solid var(--glass-border);
            display: flex; align-items: center; gap: 15px;
        }
        .back-btn { background: var(--glass); border: 1px solid var(--glass-border); color: #fff; width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
        .back-btn svg { width: 20px; height: 20px; fill: #fff; }
        .search-page-top .big-search-box { padding: 10px 15px; border-radius: 12px; background: rgba(255,255,255,0.05); }
        .search-page-top .big-search-box input { font-size: 15px; }

        .result-item {
            background: var(--glass); padding: 20px; border-radius: 16px;
            border: 1px solid var(--glass-border); margin-bottom: 15px;
            cursor: pointer; text-decoration: none; display: block; color: var(--text);
        }
        .result-item:active { background: rgba(255,255,255,0.08); }
        .result-item .url { color: var(--secondary); font-size: 13px; margin-bottom: 8px; font-weight: 600; }
        .result-item h3 { color: var(--primary); font-size: 18px; font-weight: 700; margin-bottom: 8px; }
        .result-item p { color: var(--text-muted); font-size: 14px; line-height: 1.5; font-weight: 500; }
        
        .loader { text-align: center; color: var(--text-muted); padding: 30px 0; font-weight: 600; }
        .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.1); border-radius: 50%; border-top-color: var(--primary); animation: spin 1s ease-in-out infinite; margin-bottom: 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- МАГАЗИН --- */
        .shop-top { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .product-card {
            background: var(--glass); border-radius: 24px; padding: 20px 15px;
            border: 1px solid var(--glass-border); display: flex; flex-direction: column;
            align-items: center; text-align: center; backdrop-filter: blur(10px); transition: all 0.2s;
        }
        .product-card:active { transform: scale(0.96); }
        .product-img { width: 70px; height: 70px; object-fit: contain; margin-bottom: 12px; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5)); }
        .product-title { font-size: 15px; font-weight: 800; margin-bottom: 4px; line-height: 1.2; }
        .product-price { font-size: 18px; font-weight: 800; color: var(--primary); margin-bottom: 15px; }
        .btn-buy { width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 14px; font-weight: 800; font-size: 14px; box-shadow: 0 4px 15px var(--primary-glow); cursor: pointer; }
        .btn-buy:active { background: #7c3aed; }
        .section-title { font-size: 20px; font-weight: 800; margin-bottom: 18px; display: flex; align-items: center; gap: 10px; letter-spacing: -0.5px; }
        .section-title::before { content: ''; display: block; width: 4px; height: 20px; background: var(--primary); border-radius: 4px; box-shadow: 0 0 10px var(--primary-glow); }

        /* --- БАННЕР --- */
        .ad-banner {
            margin: 30px 20px 20px 20px; padding: 18px 20px; background: var(--glass);
            border: 1px dashed var(--glass-border); border-radius: 16px; display: flex;
            flex-direction: column; gap: 5px; backdrop-filter: blur(10px);
        }
        .ad-header { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .ad-header svg { width: 16px; height: 16px; fill: var(--secondary); }
        .ad-text { font-size: 14px; font-weight: 600; color: var(--text); line-height: 1.4; }
        .ad-text span { color: var(--secondary); }
    </style>
</head>
<body>

    <!-- Шапка с логотипом и попапом -->
    <div class="header">
        <!-- Плашка "Скоро" -->
        <div class="soon-popup" id="soon-popup">Скоро</div>

        <div class="logo-text" onclick="switchTab('home')">
            <div class="main">Star<span>Light</span></div>
            <!-- Кнопка Orbit с обработчиком клика и наведения -->
            <div class="x-orbit" id="orbit-btn" onclick="showSoon(event)" onmouseover="showSoon(event)">x Orbit</div>
        </div>
    </div>

    <!-- ЭКРАН 1: ГЛАВНАЯ -->
    <div id="screen-home" class="screen active">
        <div class="portal-grid">
            <div class="portal-btn" onclick="switchTab('search-home')">
                <div class="portal-icon"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg></div>
                <div class="portal-info"><h3>Интернет</h3><p>Глобальный поиск по Википедии и магазину</p></div>
            </div>
            <div class="portal-btn" onclick="switchTab('shop')">
                <div class="portal-icon"><svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg></div>
                <div class="portal-info"><h3>Магазин</h3><p>Покупка валюты и подписок</p></div>
            </div>
            <div class="portal-btn disabled">
                <div class="portal-icon"><svg viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4-3c-.83 0-1.5-.67-1.5-1.5S18.67 9 19.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg></div>
                <div class="portal-info"><h3>Игра</h3><p>Мини-игры и квесты</p></div>
                <div class="badge-soon">Скоро</div>
            </div>
        </div>
    </div>

    <!-- ЭКРАН 2: СТАРТ ПОИСКА -->
    <div id="screen-search-home" class="screen">
        <div class="search-home">
            <h2 style="font-size: 24px; font-weight: 800; margin-bottom: 25px; text-align: center; width: 100%;">Глобальный поиск</h2>
            <div class="big-search-box">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" id="start-search-input" placeholder="Введите запрос (например, Телефон)..." onkeypress="startSearch(event)">
            </div>
        </div>
    </div>

    <!-- ЭКРАН 3: РЕЗУЛЬТАТЫ ПОИСКА -->
    <div id="screen-search-results" class="screen" style="padding-top: 0;">
        <div class="search-page-top">
            <button class="back-btn" onclick="switchTab('search-home')">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <div class="big-search-box">
                <input type="text" id="page-search-input" onkeypress="updateSearch(event)">
            </div>
        </div>
        <div id="search-results-list"></div>
    </div>

    <!-- ЭКРАН 4: МАГАЗИН -->
    <div id="screen-shop" class="screen">
        <div class="shop-top">
            <button class="back-btn" onclick="switchTab('home')"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
            <h2 class="section-title" style="margin-bottom: 0;">Магазин</h2>
        </div>
        <div class="product-grid" id="shop-grid"></div>
    </div>

    <!-- БАННЕР -->
    <div class="ad-banner">
        <div class="ad-header">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
            Рекламный блок
        </div>
        <div class="ad-text">
            Здесь могла быть ваша реклама, но <span>StarLight</span> против спама и навязчивых баннеров. Мы ценим ваше время.
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); 
        tg.setHeaderColor('#08080c'); 
        tg.setBackgroundColor('#08080c');
        let user = tg.initDataUnsafe?.user;

        // --- ЭФФЕКТ "СКОРО" ДЛЯ ORBIT ---
        let isAnimating = false;
        function showSoon(e) {
            if (e) e.stopPropagation(); // Чтобы клик по Orbit не срабатывал как клик по логотипу (на главную)
            if (isAnimating) return;
            isAnimating = true;
            
            const popup = document.getElementById('soon-popup');
            popup.classList.remove('active');
            
            // Небольшая задержка, чтобы анимация сработала заново, если кликнуть повторно
            void popup.offsetWidth; 
            
            popup.classList.add('active');
            
            setTimeout(() => {
                isAnimating = false;
            }, 1200); // Ждем окончания анимации
        }

        // --- БАЗА МАГАЗИНА ---
        const products = [
            { id: 1, title: 'Fortnite 1000 V-Bucks', price: 599, img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/8/8c/Fortnite_V-Bucks_Logo.png/240px-Fortnite_V-Bucks_Logo.png' },
            { id: 2, title: 'Fortnite 2800 V-Bucks', price: 1499, img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/8/8c/Fortnite_V-Bucks_Logo.png/240px-Fortnite_V-Bucks_Logo.png' },
            { id: 3, title: 'Roblox 400 Robux', price: 299, img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/Roblox_player_icon_black.svg/512px-Roblox_player_icon_black.svg.png', style: 'background: #fff; border-radius: 12px; padding: 8px;' },
            { id: 4, title: 'Roblox 800 Robux', price: 549, img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/Roblox_player_icon_black.svg/512px-Roblox_player_icon_black.svg.png', style: 'background: #fff; border-radius: 12px; padding: 8px;' },
            { id: 5, title: 'Steam 500 RUB', price: 549, img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/8/83/Steam_icon_logo.svg/512px-Steam_icon_logo.svg.png' },
            { id: 6, title: 'Telegram 100 Stars', price: 149, img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/8/82/Telegram_logo.svg/240px-Telegram_logo.svg.png', style: 'border-radius: 50%; background: #229ED9; padding: 10px;' },
        ];

        function switchTab(tabId) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById('screen-' + tabId).classList.add('active');
            if(tabId === 'home' || tabId === 'search-home') document.getElementById('start-search-input').value = '';
        }

        function renderShop() {
            document.getElementById('shop-grid').innerHTML = products.map(p => `
                <div class="product-card">
                    <img src="${p.img}" class="product-img" style="${p.style || ''}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/6009/6009865.png'">
                    <div class="product-title">${p.title}</div>
                    <div class="product-price">${p.price} ₽</div>
                    <button class="btn-buy" onclick="buy('${p.title}')">Купить</button>
                </div>
            `).join('');
        }
        renderShop();

        // --- ЛОГИКА ПОИСКА ---
        function startSearch(event) {
            if (event.key === 'Enter') {
                const query = event.target.value.trim();
                if(!query) return;
                switchTab('search-results');
                document.getElementById('page-search-input').value = query;
                executeSearch(query);
            }
        }

        function updateSearch(event) {
            if (event.key === 'Enter') {
                executeSearch(event.target.value.trim());
            }
        }

        async function executeSearch(query) {
            const container = document.getElementById('search-results-list');
            if (!query) { container.innerHTML = ''; return; }

            const q = query.toLowerCase();
            const localProducts = products.filter(p => p.title.toLowerCase().includes(q));
            
            container.innerHTML = '<div class="loader"><div class="spinner"></div><br>Ищем по всему интернету...</div>';

            let html = '';

            if (localProducts.length > 0) {
                html += `<h3 style="font-size: 16px; color: var(--text-muted); margin-bottom: 15px;">Товары StarLight</h3>`;
                html += localProducts.map(p => `
                    <div class="result-item" onclick="switchTab('shop')">
                        <div class="url">starlight.shop/shop/${p.id}</div>
                        <h3>${p.title} — ${p.price} ₽</h3>
                        <p>Купить по выгодной цене в нашем магазине. Мгновенная выдача.</p>
                    </div>
                `).join('');
                html += `<div style="margin-bottom: 25px;"></div>`;
            }

            try {
                const response = await fetch(`https://ru.wikipedia.org/w/api.php?action=query&list=search&utf8=&format=json&origin=*&srsearch=${encodeURIComponent(query)}`);
                const data = await response.json();
                const wikiResults = data.query.search;

                if (wikiResults.length > 0) {
                    html += `<h3 style="font-size: 16px; color: var(--text-muted); margin-bottom: 15px;">Результаты из интернета (Википедия)</h3>`;
                    html += wikiResults.map(res => {
                        const cleanSnippet = res.snippet.replace(/<[^>]+>/g, '') + '...';
                        const wikiUrl = `https://ru.wikipedia.org/wiki/${encodeURIComponent(res.title)}`;
                        return `
                            <a href="${wikiUrl}" target="_blank" class="result-item">
                                <div class="url">ru.wikipedia.org/wiki/${res.title}</div>
                                <h3>${res.title}</h3>
                                <p>${cleanSnippet}</p>
                            </a>
                        `;
                    }).join('');
                } else if (localProducts.length === 0) {
                    html += `<div style="text-align: center; color: var(--text-muted); margin-top: 30px; font-weight: 600;">По запросу "${query}" ничего не найдено.</div>`;
                }

            } catch (error) {
                if (localProducts.length === 0) {
                    html += `<div style="text-align: center; color: var(--text-muted); margin-top: 30px; font-weight: 600;">Ошибка подключения к интернету. Проверьте сеть.</div>`;
                }
            }

            container.innerHTML = html;
        }

        function buy(productName) {
            if(!user) { alert("Для оформления заказа откройте этот магазин через Telegram-бота!"); return; }
            let msg = encodeURIComponent(`Здравствуйте! Хочу купить: ${productName}.\nМой профиль: @${user.username || user.id}`);
            window.open(`https://t.me/starlightad?text=${msg}`, '_blank');
        }
    </script>
</body>
</html>
